name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            rust_target: x86_64-pc-windows-msvc
            artifact_name: windows-x86_64
            build_command: npm run tauri:build
          - runner: macos-15-intel
            rust_target: x86_64-apple-darwin
            macos_deployment_target: "10.15"
            artifact_name: darwin-x86_64
            build_command: npm run tauri:build:mac-intel
          - runner: macos-15
            rust_target: aarch64-apple-darwin
            macos_deployment_target: "10.15"
            artifact_name: darwin-aarch64
            build_command: npm run tauri:build:mac-arm

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: ${{ matrix.rust_target }}

      - name: Install frontend dependencies
        run: npm install

      - name: Sync tag version to project
        run: node scripts/sync-version.mjs
        env:
          RELEASE_VERSION: ${{ github.ref_name }}

      - name: Build installer
        run: ${{ matrix.build_command }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_RELEASE_TAG: ${{ github.ref_name }}
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos_deployment_target }}

      - name: Verify macOS updater artifacts
        if: runner.os == 'macOS'
        shell: bash
        run: |
          bundle_root="src-tauri/target/${{ matrix.rust_target }}/release/bundle"
          find "$bundle_root" -maxdepth 3 -type f -print

          shopt -s nullglob
          dmg_files=("$bundle_root"/dmg/*.dmg)
          updater_files=("$bundle_root"/macos/*.app.tar.gz)
          signature_files=("$bundle_root"/macos/*.app.tar.gz.sig)

          if (( ${#dmg_files[@]} == 0 )); then
            echo "Missing macOS DMG in $bundle_root/dmg" >&2
            exit 1
          fi
          if (( ${#updater_files[@]} == 0 )); then
            echo "Missing macOS updater archive in $bundle_root/macos; ensure bundle.targets includes app" >&2
            exit 1
          fi
          if (( ${#signature_files[@]} == 0 )); then
            echo "Missing macOS updater signature in $bundle_root/macos" >&2
            exit 1
          fi

      - name: Upload Windows artifacts
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig

      - name: Upload macOS artifacts
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          if-no-files-found: error
          path: |
            src-tauri/target/${{ matrix.rust_target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.rust_target }}/release/bundle/macos/*.app.tar.gz
            src-tauri/target/${{ matrix.rust_target }}/release/bundle/macos/*.sig

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files and updater manifest
        run: node scripts/prepare-release.mjs
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REPOSITORY: ${{ github.repository }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
